<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👑 GOJO SATORU KING | FOX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --purple: #a855f7; --gold: #fbbf24; --bg: #0a0a0f; --text-color: #ffffff; --font-size: 14px; --nav-height: 65px; }
        html, body { width: 100%; max-width: 100vw; overflow-x: hidden; scrollbar-width: none; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at 50% 0%, #1c1335 0%, var(--bg) 70%); color: var(--text-color); min-height: 100vh; position: relative; padding-bottom: var(--nav-height); -webkit-user-select: none; user-select: none; }
        .title-font { font-family: 'Cinzel', serif; }
        .gold-text { background: linear-gradient(90deg, #fde68a, #fbbf24, #d97706, #fbbf24); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 200% auto; animation: shine 4s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        .aura { position: relative; display: inline-block; border-radius: 50%; padding: 5px; background: conic-gradient(from 0deg, var(--purple), #22d3ee, #a855f7, var(--purple)); animation: spin 6s linear infinite; box-shadow: 0 0 40px rgba(168, 85, 247, 0.6); }
        .aura img { width: 10rem; height: 10rem; border-radius: 50%; object-fit: cover; border: 4px solid #0a0a0f; animation: spin-reverse 6s linear infinite; background: #000; display: block; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        .glass-panel { background: rgba(15, 15, 25, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(168, 85, 247, 0.3); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
        .chat-box::-webkit-scrollbar { width: 5px; }
        .chat-box::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 5px; }
        .msg-user { background: rgba(168, 85, 247, 0.2); border: 1px solid rgba(168, 85, 247, 0.5); border-radius: 15px 15px 0 15px; font-size: var(--font-size); }
        .msg-user.vip { background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.6); }
        .msg-user.dictator { background: rgba(220, 38, 38, 0.15); border: 1px solid rgba(220, 38, 38, 0.8); }
        .msg-ai { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px 15px 15px 0; position: relative; padding-right: 35px; font-size: var(--font-size); }
        .speak-btn { position: absolute; top: 10px; right: 10px; background: transparent; border: none; cursor: pointer; color: var(--purple); font-size: 18px; }
        .typing-dot { display: inline-block; width: 6px; height: 6px; background: var(--purple); border-radius: 50%; margin: 0 2px; animation: bounce 1.2s infinite; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
        .particle { position: fixed; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, #a78bfa, transparent 70%); animation: float linear infinite; z-index: -1; opacity: 0.4; }
        @keyframes float { from { transform: translateY(100vh) scale(0); } to { transform: translateY(-10vh) scale(1); } }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height); background: #050508; border-top: 1px solid rgba(168, 85, 247, 0.4); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font-size: 11px; cursor: pointer; width: 33%; height: 100%; transition: 0.2s; }
        .nav-item.active { color: var(--gold); font-weight: bold; }
        .nav-item .icon { font-size: 20px; margin-bottom: 3px; }
        .page-section { display: none; width: 100%; }
        .page-section.active { display: block; }
        #send { background: linear-gradient(135deg, #a855f7, #7e22ce); transition: 0.2s; }
        #liveScreen { display: none; flex-direction: column; height: 100vh; background: radial-gradient(circle at 50% 80%, #1e3a8a 0%, var(--bg) 60%); position: fixed; top: 0; left: 0; width: 100%; z-index: 200; }
        .live-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; }
        .live-title { font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .live-icon { color: #3b82f6; font-size: 28px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .live-feed { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .live-text { font-size: 22px; text-align: center; color: #a3bffa; line-height: 1.6; }
        .fab-live { position: fixed; bottom: calc(var(--nav-height) + 20px); left: 20px; width: 60px; height: 60px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5); z-index: 90; }
    </style>
</head>
<body class="flex flex-col items-center relative w-full">

    <div id="particles"></div>

    <main class="w-full max-w-2xl px-4 mt-6 z-10 mb-4">
        <div id="page-fox" class="page-section active">
            <header class="text-center mb-6">
                <div class="aura mb-4 mx-auto"><img src="https://i.ibb.co/6PZk6y5/gojo.jpg"></div>
                <h1 class="title-font text-4xl gold-text mb-1 font-black tracking-widest">GOJO SATORU</h1>
            </header>

            <div class="glass-panel rounded-2xl p-4 mb-4 border border-purple-500/50">
                <div class="flex gap-2 mb-2">
                    <input type="password" id="apiKeyInput" placeholder="مفتاح OpenRouter" class="flex-1 bg-black/50 border border-gray-500 rounded-lg px-3 py-2 text-white text-sm focus:outline-none">
                    <button id="saveApiKey" class="bg-green-600 text-white text-sm px-4 rounded-lg">حفظ</button>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="usernameInput" placeholder="اسمك" class="flex-1 bg-black/50 border border-gray-500 rounded-lg px-3 py-2 text-white text-sm focus:outline-none">
                    <button id="saveNameBtn" class="bg-purple-600 text-white text-sm px-4 rounded-lg">تسجيل</button>
                </div>
            </div>

            <div class="glass-panel rounded-3xl p-5 mb-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="title-font text-xl text-purple-300">FOX</h2>
                    <button id="voiceToggle" class="bg-gray-700 text-white text-xs px-3 py-1.5 rounded-lg">🔈 صوت</button>
                </div>
                <div id="chat" class="chat-box h-80 overflow-y-auto mb-4 flex flex-col gap-3 text-sm">
                    <div class="msg-ai p-3 max-w-[85%]"><span class="text-purple-400 font-bold block mb-1">FOX:</span> Welcome.</div>
                </div>
                <div class="flex gap-2">
                    <input id="input" type="text" placeholder="Ask FOX..." class="flex-1 bg-black/60 border border-purple-500/30 rounded-xl px-4 py-3 text-white">
                    <button id="send" class="text-white font-bold px-6 rounded-xl">Send</button>
                </div>
            </div>
        </div>

        <div id="page-characters" class="page-section">
            <h2 class="title-font text-2xl text-center gold-text mb-6">الشخصيات</h2>
        </div>

        <div id="page-japanese" class="page-section">
            <h2 class="title-font text-2xl text-center gold-text mb-6">الاسم بالياباني</h2>
            <div class="glass-panel rounded-3xl p-6">
                <div class="flex gap-2">
                    <input type="text" id="japaneseNameInput" placeholder="مثال: أحمد" class="flex-1 bg-black/50 border border-gray-500 rounded-lg px-3 py-3 text-white">
                    <button id="translateNameBtn" class="bg-red-600 text-white px-5 rounded-lg">ترجمة</button>
                </div>
                <p id="japaneseResult" class="text-4xl text-yellow-400 font-bold text-center mt-6"></p>
                <button id="speakJapaneseBtn" class="bg-gray-700 text-white text-sm px-6 py-2 rounded-xl mt-4 w-full hidden">🔊 نطق</button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('page-fox', this)"><div class="icon">🦊</div><div>Fox</div></div>
        <div class="nav-item" onclick="switchTab('page-characters', this)"><div class="icon">👥</div><div>الشخصيات</div></div>
        <div class="nav-item" onclick="switchTab('page-japanese', this)"><div class="icon">🇯🇵</div><div>الياباني</div></div>
    </nav>

    <div class="fab-live" onclick="openLive()">✨</div>

    <!-- شاشة اللايف -->
    <div id="liveScreen">
        <div class="live-header">
            <div style="font-size: 24px; cursor: pointer;" onclick="closeLive()">✕</div>
            <div class="live-title">Live <span class="live-icon">✨</span></div>
            <div style="font-size: 24px;"></div> <!-- مساحة فاضية -->
        </div>
        <div class="live-feed">
            <div class="live-text" id="liveStatus">جاري التحميل...</div>
        </div>
        <!-- شلت الزراير خالص -->
    </div>

    <script>
        window.addEventListener('load', () => {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(s => s.getTracks().forEach(t => t.stop())).catch(e => console.log(e));
        });

        function switchTab(pageId, navElement) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            navElement.classList.add('active');
        }

        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        let API_KEY = localStorage.getItem('openrouter_key') || "";
        const MODEL = "openrouter/free";
        let isVoiceEnabled = false;

        document.getElementById('saveApiKey').onclick = () => {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key.startsWith('sk-or-')) { localStorage.setItem('openrouter_key', key); API_KEY = key; alert('تم الحفظ'); }
        };

        document.getElementById('voiceToggle').onclick = () => {
            isVoiceEnabled = !isVoiceEnabled;
            document.getElementById('voiceToggle').innerText = isVoiceEnabled ? "🔊 صوت مفعل" : "🔈 صوت";
        };

        function speakText(text, lang = 'ar') {
            if (!isVoiceEnabled) return;
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text.replace(/<[^>]*>?/gm, ''));
            utterance.rate = 1.2;
            window.speechSynthesis.speak(utterance);
        }

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = isUser ? 'msg-user p-3 self-end max-w-[85%] ml-auto text-right' : 'msg-ai p-3 max-w-[85%]';
            div.innerHTML = isUser ? `<span class="text-purple-300 font-bold block mb-1">You:</span> ${text}` : `<button class="speak-btn" onclick="speakText(this.parentElement.innerText)">🔊</button><span class="text-purple-400 font-bold block mb-1">FOX:</span> ${text}`;
            chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById('send').onclick = async () => {
            const text = input.value.trim(); if (!text) return;
            addMessage(text, true); input.value = '';
            
            const typing = document.createElement('div');
            typing.className = 'msg-ai p-3 max-w-[85%]';
            typing.innerText = '...';
            chat.appendChild(typing); chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
                    body: JSON.stringify({ model: MODEL, messages: [{ role: "user", content: text }] })
                });
                const data = await res.json(); typing.remove();
                const reply = data.choices[0].message.content; addMessage(reply, false); speakText(reply);
            } catch (err) { typing.remove(); addMessage("Error: " + err.message, false); }
        };

        // ================= منطق اللايف التلقائي =================
        const liveScreen = document.getElementById('liveScreen');
        const liveStatus = document.getElementById('liveStatus');
        let recognition = null;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'ar-EG';
            recognition.interimResults = true;

            recognition.onstart = () => {
                isListening = true;
                liveStatus.textContent = "أنا أسمعك...";
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                }
                if (finalTranscript) {
                    liveStatus.textContent = `أنت: ${finalTranscript}`;
                    sendLiveMessage(finalTranscript);
                    recognition.stop(); // يقف عشان يسمع الرد
                }
            };

            recognition.onend = () => {
                isListening = false;
                if(liveScreen.style.display !== 'none' && !window.speechSynthesis.speaking) {
                     // لو لسه في شاشة اللايف ومفيش صوت شغال، يرجع يسمع
                     try { recognition.start(); } catch(e) {}
                }
            };
        }

        function openLive() {
            liveScreen.style.display = 'flex';
            liveStatus.textContent = "جاري تفعيل المايك...";
            startListening();
        }

        function closeLive() {
            liveScreen.style.display = 'none';
            if(recognition) recognition.stop();
            window.speechSynthesis.cancel();
        }

        // دالة تشغيل المايك
        function startListening() {
            if (!recognition) return alert("متصفحك لا يدعم المايك.");
            navigator.mediaDevices.getUserMedia({ audio: true }).then(() => {
                if (!isListening && !window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                    try { recognition.start(); } catch(e) { recognition.stop(); setTimeout(() => recognition.start(), 200); }
                }
            }).catch(() => { liveStatus.textContent = "الرجاء السماح بالمايك."; });
        }

        async function sendLiveMessage(text) {
            liveStatus.textContent = "جاري التفكير...";
            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
                    body: JSON.stringify({ model: MODEL, messages: [{ role: "system", content: "You are FOX. Answer in ONE short sentence." }, { role: "user", content: text }] })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                liveStatus.textContent = reply;
                
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(reply);
                utterance.lang = 'ar-EG';
                utterance.rate = 1.2;
                utterance.onend = () => {
                    // أول ما يخلص نطق، يرجع يفتح المايك تاني لوحده
                    if (liveScreen.style.display !== 'none') startListening();
                };
                window.speechSynthesis.speak(utterance);
            } catch (e) { liveStatus.textContent = "خطأ: " + e.message; }
        }
    </script>
</body>
                                                                                              </html>
